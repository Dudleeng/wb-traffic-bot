name: Auto Post to Telegram

# РАСПИСАНИЕ (время UTC! Москва = UTC+3)
on:
  schedule:
    # 06:00 UTC = 09:00 МСК
    - cron: '0 6 * * *'
    # 11:00 UTC = 14:00 МСК
    - cron: '0 11 * * *'
    # 16:00 UTC = 19:00 МСК
    - cron: '0 16 * * *'
  # Ручной запуск (для теста)
  workflow_dispatch:

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Generate and post
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python generate_post.py
